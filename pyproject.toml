[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-league-exporter"
version = "0.1.0"
description = "Export fantasy leagues into git-friendly, AI-readable snapshots"
requires-python = ">=3.11"

[project.scripts]
fantasy-export = "fantasy_league_exporter.cli:main"
sleeper-export = "fantasy_league_exporter.cli:main"

[tool.setuptools.packages.find]
include = ["fantasy_league_exporter*"]