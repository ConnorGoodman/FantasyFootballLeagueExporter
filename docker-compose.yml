services:
  fantasy-export:
    build: .
    command: ["export", "${FANTASY_LEAGUE_ID:-${SLEEPER_LEAGUE_ID}}", "/export", "--provider", "${FANTASY_PROVIDER:-sleeper}", "--weeks", "${FANTASY_WEEKS:-${SLEEPER_WEEKS:-18}}"]
    volumes:
      - "${FANTASY_EXPORT_FOLDER:-${SLEEPER_EXPORT_FOLDER:-./league-export}}:/export"
    restart: "no"